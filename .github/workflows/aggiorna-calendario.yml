name: Aggiorna calendario Virtus

on:
  schedule:
    # una volta al giorno alle 05:17 UTC (07:17 ora legale italiana, 06:17 ora solare)
    - cron: "17 5 * * *"
  workflow_dispatch: {}   # permette di lanciarlo a mano dal tab "Actions"

permissions:
  contents: write

concurrency:
  group: aggiorna-calendario
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Genera i file .ics
        run: python virtus_calendar.py --out docs

      - name: Salva le modifiche (solo se qualcosa è cambiato)
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/*.ics
          if git diff --cached --quiet; then
            echo "Nessuna modifica al calendario."
          else
            git commit -m "Aggiorna calendario $(date -u +'%Y-%m-%d %H:%M') UTC"
            git push
          fi
